name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Python version comes from .python-version; --locked fails if uv.lock is out of date.
      - name: Install dependencies
        run: uv sync --locked

      # Tests use mock data and a scripted LLM, so no API keys or secrets are needed.
      - name: Run tests
        run: uv run pytest -q
